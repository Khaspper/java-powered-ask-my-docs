spring.application.name=askmydocs

# Where the database is, and who to log in as.
# These match the values in compose.yaml.
spring.datasource.url=jdbc:postgresql://localhost:5432/askmydocs
spring.datasource.username=askmydocs
spring.datasource.password=askmydocs

# "update" means: on startup, look at my Java classes and create or add
# any table and column that is missing. It never drops anything.
spring.jpa.hibernate.ddl-auto=update

# Print the SQL it runs, so you can watch it work.
spring.jpa.show-sql=true

# Uploads. Our own 10 MB rule lives in Java so we can answer 413 nicely;
# these are set a little higher so Spring does not reject the request first.
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=11MB

# Without this, Spring hides our error text and the 409 never names the
# document you already uploaded.
server.error.include-message=always

# The Gemini key is read from the shell, never written down here.
# Start the app from a terminal where you have run: export GEMINI_API_KEY=...
gemini.api-key=${GEMINI_API_KEY}
gemini.embedding-model=gemini-embedding-2
gemini.generation-model=gemini-3.7-flash
